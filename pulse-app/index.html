<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse — DF Foods Instagram Analytics</title>
    <meta
      name="description"
      content="Instagram content analytics platform for DF Foods Marketing."
    />
    <!-- Set the theme before first paint so the boot splash (and the app) render
         in the right theme immediately — no light/dark flash while React mounts.
         Mirrors theme-provider.tsx: key "pulse-theme", default "dark". -->
    <script>
      (function () {
        try {
          document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("pulse-theme") || "dark"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <!-- The redesign's type: Plus Jakarta Sans, with Geist Mono for task
         numbers and timers. Used by My Day for now (pages/my-day.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,700..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
