<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse — DF Foods Instagram Analytics</title>
    <meta
      name="description"
      content="Instagram content analytics platform for DF Foods Marketing."
    />
    <!-- Set the theme before first paint so the boot splash (and the app) render
         in the right theme immediately — no light/dark flash while React mounts.
         Mirrors theme-provider.tsx: key "pulse-theme", default "dark". -->
    <script>
      (function () {
        try {
          document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("pulse-theme") || "dark"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
