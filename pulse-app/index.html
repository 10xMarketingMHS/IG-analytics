<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Add to Home Screen opens Echo like an app: full screen, its own icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Echo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The phone's status bar matches Echo's own light/dark setting (set below
         and by theme-provider.tsx), not the phone's. -->
    <meta name="theme-color" content="#0a0713" />
    <title>Echo</title>
    <meta
      name="description"
      content="Echo: the Media House team's work, from brief to results."
    />
    <!-- Set the theme before first paint so the boot splash (and the app) render
         in the right theme immediately — no light/dark flash while React mounts.
         Mirrors theme-provider.tsx: key "pulse-theme", default "dark". -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pulse-theme") || "dark";
          document.documentElement.setAttribute("data-theme", t);
          var ac = localStorage.getItem("pulse-accent");
          var known = ["violet", "indigo", "blue", "orchid", "pink", "green", "amber", "sunset"];
          document.documentElement.setAttribute("data-accent", known.indexOf(ac) >= 0 ? ac : "violet");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "light" ? "#f3f0fb" : "#0a0713");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <!-- The redesign's type: Plus Jakarta Sans, with Geist Mono for task
         numbers and timers. Used by My Day for now (pages/my-day.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,700..800&display=swap" rel="stylesheet" />
    <!-- Icons for Home widgets and Attendance (Pulse Redesign v7) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
